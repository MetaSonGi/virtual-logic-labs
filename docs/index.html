<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>가상 논리회로 실험실 — MetaSonGi</title>
  <meta name="description" content="3D 브레드보드에 칩을 놓고 전선을 이은 뒤 전원을 켜서 신호를 확인하는 논리회로 실험실 (Unity 6 WebGL)">
  <style>
    html, body { margin: 0; height: 100%; background: #070b16; overflow: hidden; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: #070b16; touch-action: none; }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center; background: #070b16; color: #eaf0ff;
      font-family: "Pretendard", -apple-system, "Noto Sans KR", "Segoe UI", sans-serif; transition: opacity .4s;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    .box { text-align: center; width: min(320px, 80vw); }
    .logo { font-weight: 800; font-size: 20px; margin-bottom: 18px; }
    .logo b { color: #00e5a0; text-shadow: 0 0 12px #00e5a0; }
    .bar { height: 6px; background: #1f2b45; border-radius: 3px; overflow: hidden; }
    .fill { height: 100%; width: 0; background: linear-gradient(90deg, #00e5a0, #4f7cff); box-shadow: 0 0 12px #00e5a0; transition: width .2s; }
    .sub { margin-top: 12px; font-size: 13px; color: #8b98b8; }
    #error { color: #ff5470; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <div class="box">
      <div class="logo"><b>◆</b> 가상 논리회로 실험실</div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="sub" id="status">불러오는 중… 처음에는 몇 초 걸려요</div>
    </div>
  </div>
  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/docs.data",
      frameworkUrl: buildUrl + "/docs.framework.js",
      codeUrl: buildUrl + "/docs.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Software Engineering ECE Rutgers Group 10",
      productName: "Virtual Logic Labs",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };
    var canvas = document.querySelector("#unity-canvas");
    var fill = document.querySelector("#fill");
    var status = document.querySelector("#status");
    var script = document.createElement("script");
    script.src = buildUrl + "/docs.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        fill.style.width = Math.round(p * 100) + "%";
      }).then(function () {
        document.querySelector("#loading").classList.add("hide");
        canvas.focus();
      }).catch(function (message) {
        status.id = "error";
        status.textContent = "불러오지 못했어요: " + message;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
